name: Atualizar Notícias do Senado

on:
  schedule:
    # 09:00, 14:00, 19:00 e 22:00 (Horário de Brasília)
    - cron: '0 1,12,17,22 * * *'
  workflow_dispatch:
jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script de captura de notícias
        run: |
          python atualizar_noticias.py

      - name: Salvar alterações no GitHub (commit e push)
        run: |
          git config --global user.name "Robô de Notícias"
          git config --global user.email "bot@olitavadvogados.com.br"
          git add noticias.json img/noticias/
          if git diff --staged --quiet; then
            echo "Nenhuma notícia nova para salvar hoje."
          else
            git commit -m "Atualização automática de notícias [skip ci]"
            git push
          fi
